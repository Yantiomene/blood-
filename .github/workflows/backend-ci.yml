name: CI

on:
  push:
    paths:
      - 'backend/**'
      - 'client/**'
      - 'frontend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'client/**'
      - 'frontend/**'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            client:
              - 'client/**'
            frontend:
              - 'frontend/**'

  test-and-migrate:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Wait for Postgres
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..15}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Provision database and PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE USER blooduser WITH PASSWORD 'bloodpwd';" || true
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE blooddb OWNER blooduser;" || true
          psql -h 127.0.0.1 -U postgres -d blooddb -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create .env for backend
        run: |
          cat > .env << 'EOF'
          PORT=2000
          SERVER_URL=http://localhost:2000
          CLIENT_URL=http://localhost:3000
          SECRET=dev_secret
          DB_USER=blooduser
          DB_PASSWORD=bloodpwd
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=blooddb
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          EOF

      - name: Run migrations
        run: npx knex migrate:latest --knexfile knexfile.js

      - name: Run seeds
        run: npx knex seed:run --knexfile knexfile.js

      - name: Run tests with coverage
        env:
          NODE_ENV: test
        run: npm test -- --runInBand --detectOpenHandles --verbose

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  client-verify:
    name: Client (Next.js) lint, typecheck, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true'
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  legacy-frontend-verify:
    name: Legacy frontend (CRA) build and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run tests (CRA)
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests